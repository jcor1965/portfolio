name: Personal core tests

on:
  push:
    branches:
      - personal/main
      - personal/update-**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test the core
        run: >-
          mvn --batch-mode --no-transfer-progress
          -f portfolio-app/pom.xml
          -Plocal-dev
          -pl :portfolio-target-definition,:name.abuchen.portfolio.pdfbox1,:name.abuchen.portfolio.pdfbox3,:name.abuchen.portfolio,:name.abuchen.portfolio.junit,:name.abuchen.portfolio.tests
          -am verify
      - name: Compile application and personal UI integration
        run: >-
          mvn --batch-mode --no-transfer-progress
          -f portfolio-app/pom.xml -Plocal-dev -DskipTests package
